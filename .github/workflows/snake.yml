name: Generate snake

on:
  schedule:
    # set cron to avoid rate limit on GitHub API
    - cron: "0 */12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      # generate the snake animation in SVG format
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg#palette-dark

      # push the SVG content to the content branch
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: content
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
